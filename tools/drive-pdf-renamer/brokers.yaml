# 券商辨識與命名規則設定檔
#
# 每一份 PDF 會依序比對下面每個券商區塊的 match.contains 關鍵字（只要有一個出現在
# PDF 第一頁文字裡就算命中），命中後就用該區塊的 extract 規則去擷取股票代碼、
# 股票名稱、報告日期，並用 display_name 當作檔名裡的券商名稱。
#
# 要支援新的券商，只要在 brokers 底下複製一個區塊出來改，不用動到程式本身。

brokers:
  - name: 國泰期貨
    display_name: 國泰
    match:
      contains:
        - "國泰期貨股份有限公司"
        - "國泰證期研究部"
    extract:
      # 擷取「股票名稱 股票代碼 TT」，例如「中砂 1560 TT」「融程電 3416TT」
      # 名稱允許中文/英文/數字混合，代碼抓 3~6 碼數字
      stock_code_name:
        pattern: '([一-鿿A-Za-z0-9&\-]{1,12})\s*[\r\n\s]*(\d{3,6})\s*TT'
      # 擷取報告日期，格式為西元年/月/日，例如「2026/07/09」
      date:
        pattern: '(\d{4})[/／](\d{1,2})[/／](\d{1,2})'

  # 範例：之後如果要加其他券商，可以參考下面這個空白範本
  # - name: 範例券商全名
