# 券商辨識與命名規則設定檔
#
# 每一份 PDF 會依序比對下面每個券商區塊的 match.contains 關鍵字（只要有一個出現在
# PDF 前兩頁文字裡就算命中，由上而下比對，第一個命中的就採用），命中後就用該區塊
# 的 extract 規則去擷取股票代碼、股票名稱、報告日期，並用 display_name 當作檔名
# 裡的券商名稱。
#
# extract 底下有三個獨立規則：
#   code：{pattern, group?} → 正規表示式，預設抓 group(1) 當股票代碼；如果代碼
#         跟名稱是同一個正規表示式裡的不同括號（例如「志聖(2467)」一次比對），
#         可以額外指定 group 是第幾組
#   name：同上，但抓的是股票名稱
#   date：有 style 跟 pattern 兩個欄位
#     - style: slash      → pattern 有 3 個 group：年、月、日，例如 2026/07/09
#     - style: cjk        → pattern 有 3 個 group：年、月、日，例如 2026 年 7 月 9 日
#     - style: roc7       → pattern 有 1 個 group：民國年 7 碼緊接在一起，例如 1150904
#                            （民國115年09月04日），程式會自動 +1911 換算西元年
#     - style: cjk_month  → pattern 有 3 個 group：中文數字月份、日、年，
#                            例如「九月 04, 2026」
#
# 要支援新的券商，只要在 brokers 底下複製一個區塊出來改，不用動到程式本身；
# 程式預設會讀 PDF 前兩頁的文字來比對（有些券商的代碼/名稱標題印在第二頁）。
#
# 目前只有國泰期貨、華南投顧、富邦投顧、凱基投顧、統一投顧這五家是拿實際報告驗證過的；
# 其他券商的區塊是先用「股票名稱 股票代碼 TT」+「YYYY/MM/DD」這種常見排版打底，
# match.contains 的公司全名也是用一般公開資訊猜測，兩者都還沒拿這些券商的真實
# 報告驗證過。正式使用前，請先用 workflow 的 dry_run: true 跑一次，確認擷取結
# 果正確；如果某家券商的排版不一樣，就照下面的範本調整那家的 pattern 或
# match.contains 關鍵字即可。

# 共用的預設擷取規則：「股票名稱 股票代碼 TT」+ 西元 YYYY/MM/DD 日期，
# 沒特別驗證過排版的券商先用這個打底（用 <<: *default_extract）。
_default_extract: &default_extract
  # 擷取股票代碼，例如「中砂 1560 TT」裡的 1560
  code:
    pattern: '(\d{3,6})\s*TT'
  # 擷取股票名稱，例如「中砂 1560 TT」裡的中砂；名稱允許中文/英文/數字混合
  name:
    pattern: '([一-鿿A-Za-z0-9&\-]{1,12})\s*[\r\n\s]*\d{3,6}\s*TT'
  # 擷取報告日期，格式為西元年/月/日，例如「2026/07/09」
  date:
    style: slash
    pattern: '(\d{4})[/／](\d{1,2})[/／](\d{1,2})'

brokers:
  - name: 國泰期貨
    display_name: 國泰
    match:
      contains:
        - "國泰期貨股份有限公司"
        - "國泰證期研究部"
    extract:
      <<: *default_extract

  - name: 華南投顧
    display_name: 華南
    match:
      # 「華南投顧」這幾個字實際上只印在報告最後一頁的版權聲明，程式只讀前兩頁
      # 看不到；改用研究員電子信箱的網域「entrust.com.tw」當辨識關鍵字，這個
      # 在前兩頁的「::研究員聯絡方式::」區塊一定會出現。
      contains:
        - "entrust.com.tw"
    extract:
      # 報告內文開頭固定格式：股票名稱(股票代碼)，例如「志聖(2467)」
      # 「鈞興-KY(4571)」，名稱本身可能含有「-」，所以只排除空白/換行/左括號，
      # 讓名稱可以完整吃到「(」之前的所有字元。
      code:
        pattern: '([^\s\(\n]+)\s*\((\d{3,6})\)'
        group: 2
      name:
        pattern: '([^\s\(\n]+)\s*\((\d{3,6})\)'
        group: 1
      # 日期格式為「2026年9月4日」（訪談報告開頭那行）
      date:
        style: cjk
        pattern: '(\d{4})\s*年\s*(\d{1,2})\s*月\s*(\d{1,2})\s*日'

  - name: 富邦投顧
    display_name: 富邦
    match:
      contains:
        - "富邦投顧"
        - "富邦證券股份有限公司"
    extract:
      # 報告內文格式：股票名稱 (股票代碼 TT)，例如「台達電 (2308 TT)」
      code:
        pattern: '\(\s*(\d{3,6})\s*TT\s*\)'
      name:
        pattern: '([一-鿿A-Za-z0-9&\-]{1,10})\s*\(\s*\d{3,6}\s*TT\s*\)'
      # 日期格式為「2026 年 9 月 4 日」
      date:
        style: cjk
        pattern: '(\d{4})\s*年\s*(\d{1,2})\s*月\s*(\d{1,2})\s*日'

  - name: 凱基投顧
    display_name: 凱基
    match:
      # 同一家券商在不同報告類型裡，署名寫法不太一樣：有的是「凱基投顧 XXX」，
      # 有的只在「資料來源：公司資料，凱基」這樣簡短帶過，所以額外加上信箱
      # 網域「kgi.com」（凱基英文簡稱 KGI）當更穩定的關鍵字。
      contains:
        - "凱基投顧"
        - "凱基證券投資顧問股份有限公司"
        - "kgi.com"
    extract:
      # 報告內文格式：台灣 股票名稱 \n (股票代碼.TW/股票代碼 TT)，
      # 例如「台灣 倍利科\n\n(7822.TW/7822 TT)」；上櫃股票則是「.TWO」
      # 而不是「.TW」，例如「群聯\n(8299.TWO/8299 TT)」，所以用 TWO? 涵蓋兩種；
      # 「.」跟「TW」中間有時候會多一個空格，例如「3026. TW/3026 TT」，所以用
      # \.\s* 而不是單純的 \. 。
      code:
        pattern: '\((\d{3,6})\.\s*TWO?/\d{3,6}\s*TT\)'
      name:
        pattern: '台灣\s+([一-鿿A-Za-z0-9&\-]{1,10})\s*[\r\n\s]*\(\d{3,6}\.\s*TWO?/\d{3,6}\s*TT\)'
      # 日期格式為中文數字月份，例如「九月 04, 2026」
      date:
        style: cjk_month
        pattern: '([一二三四五六七八九十]+月)\s*(\d{1,2}),\s*(\d{4})'

  - name: 統一投顧
    display_name: 統一
    match:
      # 研究員電子信箱網域「uni-psg.com」在第一頁一定會出現；不用「統一」兩個字
      # 當關鍵字是因為這是常見詞，容易在報告內文其他地方誤判命中。
      contains:
        - "uni-psg.com"
    extract:
      # 報告內文格式：股票名稱 (股票代碼.TT)，例如「創意 (3443.TT)」
      # 代碼跟 TT 中間可能有句點也可能沒有，所以用 [\.\s]* 涵蓋兩種情況。
      code:
        pattern: '([一-鿿A-Za-z0-9&\-]{1,10})\s*\((\d{3,6})[\.\s]*TT\)'
        group: 2
      name:
        pattern: '([一-鿿A-Za-z0-9&\-]{1,10})\s*\((\d{3,6})[\.\s]*TT\)'
        group: 1
      # 日期格式為西元年/月/日，例如「2026/09/07」
      date:
        style: slash
        pattern: '(\d{4})[/／](\d{1,2})[/／](\d{1,2})'

  # 下面這些券商還沒拿真實報告驗證過，是用公開資訊猜的公司全名 + 通用排版打底，
  # 使用前務必先用 dry_run: true 測試，抓錯了再照上面驗證過的區塊為範本調整。
  - name: 元大證券
    display_name: 元大
    match:
      contains:
        - "元大證券股份有限公司"
        - "元大投顧"
    extract:
      <<: *default_extract

