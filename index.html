<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forward P/E 追蹤工具</title>
<link rel="stylesheet" href="style.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<div class="app">

<div class="card">
  <div class="row" style="justify-content:space-between">
    <div class="row">
      <button class="small primary" id="tabDetail">個股明細</button>
      <button class="small" id="tabRanking">全部股票排行</button>
    </div>
    <button class="small" id="btnSync">🔄 同步資料</button>
  </div>
  <div id="stockPickerRow" class="row" style="margin-top:8px">
    <div>
      <span class="label">股票</span>
      <select id="stockSelect"></select>
    </div>
    <input type="text" id="stockTypeIn" placeholder="或輸入股票代碼" style="width:140px">
  </div>
  <div class="hint">股票下拉選單會列出資料表裡已有的股票；也可以直接輸入代碼查詢（需該代碼已在資料表裡才查得到資料）。按「同步資料」會從Google Drive讀取最新的「券商報告追蹤總表.csv」（第一次使用需要先完成Google授權）。</div>
  <div id="syncStatus" class="hint" style="margin-top:6px"></div>
</div>

<div id="mainArea"></div>

</div>
<script src="app.js"></script>
</body>
</html>
