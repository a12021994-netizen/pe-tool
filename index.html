<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forward P/E 河流圖工具</title>
<link rel="stylesheet" href="style.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
<div class="app">

<div class="card">
  <div class="row" style="justify-content:space-between">
    <h2 style="margin:0">Google Drive 匯入</h2>
    <button class="small" id="btnDriveConnect">連接 Google Drive</button>
  </div>
  <div class="row" style="margin-top:8px">
    <button class="small primary" id="btnOneClickImport">一鍵匯入</button>
  </div>
  <div class="hint">按「一鍵匯入」會自動掃描Google Drive資料夾裡所有PDF券商報告，抓取股價、目標價、EPS等數字並直接存成報告快照。已經匯入過的檔案會自動略過，不會重複匯入。PDF格式差異大，自動判讀不保證100%準確，匯入後建議到下方報告列表核對數字。</div>
  <div id="driveStatus" class="hint" style="margin-top:6px"></div>
</div>

<div class="card">
  <div class="row" style="justify-content:space-between">
    <div class="row">
      <div>
        <span class="label">股票</span>
        <select id="stockSelect"></select>
      </div>
      <button class="small" id="btnAddStock">+ 新增股票</button>
      <button class="small" id="btnDelStock" style="display:none">刪除此股票</button>
    </div>
  </div>
  <div id="addStockForm" style="display:none;margin-top:10px;border-top:0.5px solid var(--border);padding-top:10px">
    <div class="row">
      <div><span class="label">快速選取(常見追蹤股)</span>
        <select id="quickPick" style="width:180px"></select>
      </div>
    </div>
    <div class="row" style="margin-top:8px">
      <div><span class="label">股票代碼</span><input type="text" id="newCode" placeholder="輸入代碼,例如3665" style="width:120px"></div>
      <div><span class="label">股票名稱</span><input type="text" id="newName" placeholder="貿聯-KY" style="width:140px"></div>
      <button class="primary small" id="btnSaveStock" style="margin-top:16px">新增</button>
    </div>
    <div class="hint">可從上方下拉選單快速選取常見個股(會自動帶入代碼與名稱),或直接在下面兩個欄位手動輸入任意股票代碼與名稱。</div>
  </div>
</div>

<div id="mainArea"></div>

</div>
<script src="app.js"></script>
</body>
</html>
